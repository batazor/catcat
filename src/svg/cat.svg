<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100" aria-hidden="true" stroke-linejoin="round" stroke-linecap="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- tail: continuous curves, rounded tip, and soft tapered stripes -->
<g class="tail">
  <path d="M84 85C105 89 123 77 124 61C124.75 49 119 41 112 42C108.5 42.5 107.5 45 109.5 47C111.5 49 113 47.5 114.5 50C119 57.5 114 68 105 73C98 77 91 78 84 77Z" fill="var(--cat)" stroke="var(--cat-dark)" stroke-width="1.8"/>
  <g fill="var(--cat-dark)" opacity=".55">
    <path d="M100 82C102 80 102 79 101 77C104 78 105 80 103 82C102 82.5 101 82.5 100 82Z"/>
    <path d="M112 76C112 73 111 72 109 71C112 71 114 72 115 74C114 75 113 75.5 112 76Z"/>
    <path d="M121 65C119 63 118 63 116 63C118 61 120 61 122 63C122 64 121.5 64.5 121 65Z"/>
  </g>
</g>
<!-- body -->
<ellipse cx="60" cy="76" rx="31" ry="20" fill="var(--cat)" stroke="var(--cat-dark)" stroke-width="1.8"/>
<path d="M51 73Q60 77 69 73C70 77 73 83 72 87C71 92 66 94 60 94S49 92 48 87C47 83 50 77 51 73Z" fill="var(--cat-belly)"/>
<!-- front legs and soft paws, seen from above: curved toe seams, no exposed pads -->
<g class="paws">
  <g class="paw-front">
    <path d="M40 76c-2 4-1 8-3 12-4 1-4 6 0 8 4 3 14 3 18-1 3-4-1-7-5-8V76" fill="var(--cat)" stroke="var(--cat-dark)" stroke-width="1.8"/>
    <path d="M38 90q7-5 14 0" fill="none" stroke="var(--cat-belly)" stroke-width="2.6" opacity=".45"/>
    <path d="M41 96q-1-3 0-5M46 97q-1-3 0-5M51 95q-1-2-.3-4" fill="none" stroke="var(--cat-dark)" stroke-width="1.3" opacity=".7"/>
  </g>
  <g class="paw-front" transform="translate(120 0) scale(-1 1)">
    <path d="M40 76c-2 4-1 8-3 12-4 1-4 6 0 8 4 3 14 3 18-1 3-4-1-7-5-8V76" fill="var(--cat)" stroke="var(--cat-dark)" stroke-width="1.8"/>
    <path d="M38 90q7-5 14 0" fill="none" stroke="var(--cat-belly)" stroke-width="2.6" opacity=".45"/>
    <path d="M41 96q-1-3 0-5M46 97q-1-3 0-5M51 95q-1-2-.3-4" fill="none" stroke="var(--cat-dark)" stroke-width="1.3" opacity=".7"/>
  </g>
</g>
<!-- each ear moves around its base; the head covers the moving seam -->
<g class="ear ear-left">
  <path d="M38 38c-3-12-1-23 3-30 5 4 11 11 15 18z" fill="var(--cat)" stroke="var(--cat-dark)" stroke-width="1.8"/>
  <path d="M42 33c-1-7 0-13 2-18 3 3 7 8 10 13z" fill="var(--cat-pink)"/>
</g>
<g class="ear ear-right">
  <path d="M82 38c3-12 1-23-3-30-5 4-11 11-15 18z" fill="var(--cat)" stroke="var(--cat-dark)" stroke-width="1.8"/>
  <path d="M78 33c1-7 0-13-2-18-3 3-7 8-10 13z" fill="var(--cat-pink)"/>
</g>
<!-- head: one outlined path with fluffy cheeks -->
<path d="M60 21c14 0 25 11 25 23q6 2 3 7q6 3 1 8q4 5-3 7c-5 3-14 6-26 6s-21-3-26-6q-7-2-3-7q-5-5-1-8q-3-5 3-7c0-12 11-23 26-23z" fill="var(--cat)" stroke="var(--cat-dark)" stroke-width="1.8"/>
<!-- forelock + stripes -->
<path d="M49 25q3-8 7-2q3-9 7 0q3-8 7 2q-10-5-21 0z" fill="var(--cat)" stroke="var(--cat-dark)" stroke-width="1.8"/>
<path d="M53 29l1.5 6M60 28v7M67 29l-1.5 6" stroke="var(--cat-dark)" stroke-width="2.8" opacity=".7"/>
<!-- muzzle -->
<ellipse cx="60" cy="58" rx="12" ry="7.5" fill="var(--cat-belly)"/>
<!-- eyes -->
<g class="eyes">
  <g class="eye-open">
    <defs>
      <clipPath id="eye-clip" clipPathUnits="userSpaceOnUse">
        <path d="M41.5 45C42.5 38.5 53.5 38.5 54.5 45Q48 50 41.5 45Z"/>
      </clipPath>
    </defs>
    <g class="eye">
      <path d="M41.5 45C42.5 38.5 53.5 38.5 54.5 45Q48 50 41.5 45Z" fill="var(--cat-belly)" stroke="var(--cat-dark)" stroke-width="1.5"/>
      <g clip-path="url(#eye-clip)">
        <g class="gaze">
          <ellipse cx="48" cy="44.5" rx="4.9" ry="4.8" fill="#7c9868"/>
          <ellipse cx="48" cy="44.8" rx="2.7" ry="3.6" fill="var(--cat-eye)"/>
          <circle cx="46.6" cy="43.3" r="1.3" fill="var(--cat-belly)"/>
        </g>
      </g>
      <path d="M41.5 45C42.5 38.5 53.5 38.5 54.5 45" fill="none" stroke="var(--cat-dark)" stroke-width="2.1"/>
    </g>
    <g class="eye" transform="translate(24 0)">
      <path d="M41.5 45C42.5 38.5 53.5 38.5 54.5 45Q48 50 41.5 45Z" fill="var(--cat-belly)" stroke="var(--cat-dark)" stroke-width="1.5"/>
      <g clip-path="url(#eye-clip)">
        <g class="gaze">
          <ellipse cx="48" cy="44.5" rx="4.9" ry="4.8" fill="#7c9868"/>
          <ellipse cx="48" cy="44.8" rx="2.7" ry="3.6" fill="var(--cat-eye)"/>
          <circle cx="46.6" cy="43.3" r="1.3" fill="var(--cat-belly)"/>
        </g>
      </g>
      <path d="M41.5 45C42.5 38.5 53.5 38.5 54.5 45" fill="none" stroke="var(--cat-dark)" stroke-width="2.1"/>
    </g>
  </g>
  <g class="eye-closed" fill="none" stroke="var(--cat-eye)" stroke-width="2.4"><path d="M42 47q6 5 12 0"/><path d="M66 47q6 5 12 0"/></g>
</g>
<!-- blush, nose, smile, whiskers -->
<ellipse cx="39" cy="55" rx="4.5" ry="2.8" fill="var(--cat-pink)" opacity=".6"/><ellipse cx="81" cy="55" rx="4.5" ry="2.8" fill="var(--cat-pink)" opacity=".6"/>
<path d="M57 55h6q1.2 0 .7 1l-2.6 3q-1.1 1.2-2.2 0l-2.6-3q-.5-1 .7-1z" fill="var(--cat-pink)" stroke="var(--cat-dark)" stroke-width="1"/>
<path class="tear" d="M75 52c0 3-2 5-2 7a2 2 0 0 0 4 0c0-2-2-4-2-7z" fill="#5fb8e8"/>
<path class="mouth-happy" d="M60 59.5c-1 3.5-5 4.5-7 2M60 59.5c1 3.5 5 4.5 7 2" fill="none" stroke="var(--cat-dark)" stroke-width="1.8"/>
<g class="face-wistful" fill="none" stroke="var(--cat-dark)" stroke-width="1.8">
  <path d="M42 38q6 .5 10-3M68 35q4 3.5 10 3"/>
  <path d="M60 59.5v1.2M55 64q5-4 10 0"/>
</g>
<g stroke="var(--cat-dark)" stroke-width="1.5" opacity=".8"><path d="M40 57l-13-2M40 60l-13 2M80 57l13-2M80 60l13 2"/></g>
<!-- collar + bell -->
<path d="M43 70q17 9 34 0" fill="none" stroke="var(--cat-dark)" stroke-width="6"/>
<path d="M43 70q17 9 34 0" fill="none" stroke="var(--accent)" stroke-width="3.6"/>
<circle cx="60" cy="75" r="4" fill="var(--mango)" stroke="var(--cat-dark)" stroke-width="1.4"/>
<path d="M58.2 75.3h3.6M60 76.6v1.6" stroke="var(--cat-dark)" stroke-width="1"/>
<g class="zzz" fill="var(--muted)" font-family="var(--display)" font-size="11" font-weight="700"><text x="90" y="30">z</text><text x="98" y="20">z</text><text x="108" y="9">Z</text></g>
<g class="acc" data-acc="dice"><rect x="100" y="80" width="16" height="16" rx="4" fill="#fff" stroke="var(--cat-eye)" stroke-width="1.5"/><circle cx="104.5" cy="84.5" r="1.4" fill="var(--cat-eye)"/><circle cx="111.5" cy="91.5" r="1.4" fill="var(--cat-eye)"/><circle cx="108" cy="88" r="1.4" fill="var(--cat-eye)"/></g>
<g class="acc" data-acc="ball"><circle cx="109" cy="88" r="8" fill="var(--cat-eye)"/><circle cx="109" cy="88" r="4" fill="#fff"/><text x="109" y="90.5" font-size="6" text-anchor="middle" font-weight="700" fill="var(--cat-eye)" font-family="var(--body)">8</text></g>
<g class="acc" data-acc="bird"><g class="bird" stroke="var(--cat-dark)" stroke-width="1.4" stroke-linejoin="round">
  <path d="M52 15l-5-3 2 5z" fill="#3f8fc6"/>
  <ellipse cx="60" cy="13" rx="7.5" ry="6" fill="#62b9e6"/>
  <path d="M55 13q4-5 9-1" fill="#3f8fc6"/>
  <circle cx="66.5" cy="8.5" r="4.6" fill="#62b9e6"/>
  <path d="M70.5 8.5l5 1.5-5 1.5z" fill="var(--mango)"/>
  <circle cx="67.5" cy="7.5" r="1.2" fill="var(--cat-eye)" stroke="none"/><circle cx="68" cy="7" r=".4" fill="#fff" stroke="none"/>
  <path d="M57 19l-1 3M63 19l1 3" fill="none" stroke="var(--mango)" stroke-width="1.6"/>
  <path d="M66 4l1-3M68 4.5l2-2" fill="none" stroke-width="1.2"/>
</g></g>
<g class="acc" data-acc="leaf"><g class="leaf" stroke="#2e7d4a" stroke-width="1.5" stroke-linejoin="round">
  <path d="M62 18c-1-11 7-19 18-18 1 11-6 19-18 18z" fill="#5fbf7b"/>
  <path d="M62 18l14-13" fill="none"/>
  <path d="M67 13l4 2M71 9l4 2M66 15l1-4" fill="none" stroke-width="1.1"/>
  <path d="M62 18c-6-3-8-9-4-13 5 3 7 8 4 13z" fill="#4caf6e"/>
</g></g>
<g class="acc" data-acc="shades"><rect x="40" y="40" width="18" height="13" rx="5" fill="var(--cat-eye)"/><rect x="62" y="40" width="18" height="13" rx="5" fill="var(--cat-eye)"/><path d="M58 45.5h4M40 44l-8-2M80 44l8-2" stroke="var(--cat-eye)" stroke-width="2"/><path d="M43.5 43q3-1 6 0M65.5 43q3-1 6 0" stroke="#fff" stroke-width="1" opacity=".5"/></g>
<g class="acc" data-acc="crane"><g class="leaf"><path d="M98 92l9-6-5-8 11 6 6-2-4 4 3 7-9-3-6 5z" fill="#fff" stroke="var(--cat-eye)" stroke-width="1.2"/></g></g>
<g class="acc" data-acc="cocktail"><path d="M100 72l14 0-7 10z" fill="var(--accent)" stroke="var(--cat-eye)" stroke-width="1"/><path d="M107 82v9M102 91h10" stroke="var(--cat-eye)" stroke-width="1.6"/><circle cx="112" cy="71" r="2.4" fill="var(--mango)"/></g>
  </svg>
